version: '3.8'

services:
  web:
    build: .
    container_name: php-apache
    ports:
    - "8080:80"
    # Cambiado de 8080:80 a 80:80
    volumes:
      - ./src/sistema_almacen:/var/www/html/
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: almacen
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d

volumes:
  db_data:
